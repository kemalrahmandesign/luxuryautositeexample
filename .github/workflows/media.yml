name: media

# Downloads manifest sources and re-encodes scrub films with dense keyframes.
# Runs on Actions because the build sandbox cannot reach CloudFront.
# Remember: this file must exist on the default branch before the dispatch
# API can see it, and its commits do not trigger the pages workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Fetch and encode media
        run: |
          set -euo pipefail
          mkdir -p media
          while read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in
              \#*) continue ;;
            esac
            echo "processing $name"
            case "$name" in
              *.png)
                curl -fsSL "$url" -o "media/$name"
                ;;
              *)
                curl -fsSL "$url" -o /tmp/src.mp4
                # Two encode profiles:
                #  - detail clips (car body, x-ray internals): light denoise so
                #    fine silver detail survives, gentle black floor
                #  - dark light-scene clips: strong denoise/deband and a hard
                #    crush of noisy near-blacks to true black
                case "$name" in
                  emerge|rise)
                    VF="scale=1920:1080:flags=lanczos,hqdn3d=2:1.5:4:3,deband=1thr=0.013:2thr=0.013:3thr=0.013:range=12:blur=1,colorlevels=rimin=0.02:gimin=0.02:bimin=0.02"
                    CRF=18
                    ;;
                  *)
                    VF="scale=1920:1080:flags=lanczos,hqdn3d=1:0.8:2:2,deband=1thr=0.01:2thr=0.01:3thr=0.01:range=10:blur=1,colorlevels=rimin=0.012:gimin=0.012:bimin=0.012"
                    CRF=17
                    ;;
                esac
                ffmpeg -nostdin -y -i /tmp/src.mp4 -an \
                  -vf "$VF" \
                  -c:v libx264 -preset slow -crf "$CRF" -g 4 \
                  -pix_fmt yuv420p -movflags +faststart \
                  "media/$name.mp4"
                ;;
            esac
          done < media/manifest.txt

      - name: Commit media
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git diff --cached --quiet && exit 0
          git commit -m "media: fetch and re-encode scrub films (-g 4)"
          git push

# touch: force workflow registration
